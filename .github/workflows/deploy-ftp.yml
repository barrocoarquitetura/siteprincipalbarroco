# Compila e publica automaticamente o site estático no cPanel por FTPS
name: Publicar site por FTPS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: barroco-producao
  cancel-in-progress: false

jobs:
  publicar:
    name: Compilar, validar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: ftp.barrocoarquitetura.com.br
      FTP_ORIGIN_IP: "85.155.127.7"
      FTP_PORT: "2121"
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: "/public_html"

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm run install:ci

      - name: Gerar pacote estático
        run: npm run export:ftp

      - name: Validar pacote de produção
        shell: bash
        run: |
          set -euo pipefail
          test -f ftp-static/index.html
          test -f ftp-static/.htaccess
          test -f ftp-static/robots.txt
          test -f ftp-static/sitemap.xml
          test -f ftp-static/sitemap-images.xml
          test -f ftp-static/projetos-page.html
          test -f ftp-static/blog.html
          test -d ftp-static/assets

      - name: Validar credenciais protegidas
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_PASSWORD"

      - name: Preparar conexão FTPS com a origem
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          echo "$FTP_ORIGIN_IP $FTP_SERVER" | sudo tee -a /etc/hosts >/dev/null
          getent hosts "$FTP_SERVER"

      - name: Publicar sem excluir arquivos remotos
        shell: bash
        run: |
          set -euo pipefail
          lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set ssl:check-hostname no
          open -p "$FTP_PORT" -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER"
          cd "$FTP_SERVER_DIR"
          mirror --reverse --verbose --parallel=4 --no-perms --exclude-glob "LEIA-ME-INSTALACAO.txt" "ftp-static" "."
          put -O "." "ftp-static/.htaccess"
          bye
          LFTP

      - name: Verificar o site publicado
        shell: bash
        run: |
          set -euo pipefail
          navegador="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36"
          urls=(
            "https://www.barrocoarquitetura.com.br/"
            "https://www.barrocoarquitetura.com.br/blog"
            "https://www.barrocoarquitetura.com.br/sitemap.xml"
            "https://www.barrocoarquitetura.com.br/robots.txt"
          )

          for tentativa in 1 2 3 4 5; do
            falhou=0
            for url in "${urls[@]}"; do
              if ! curl --ipv4 --fail --silent --show-error --location --max-redirs 10 --max-time 25 \
                --user-agent "$navegador" "$url" >/dev/null; then
                echo "Falha na verificação: $url (tentativa $tentativa)"
                falhou=1
                break
              fi
            done
            if [ "$falhou" -eq 0 ]; then
              exit 0
            fi
            sleep 12
          done

          echo "A publicação terminou, mas a verificação pública ainda falhou."
          curl --ipv4 --silent --show-error --head --location --max-redirs 3 --max-time 25 \
            --user-agent "$navegador" "https://www.barrocoarquitetura.com.br/" || true
          exit 1
